[workspace]
resolver = "3"
members = [
    "crates/tintcast-theme",
    "crates/tintcast-engine",
    "crates/tintcast-windows",
    "crates/tintcast-cli",
    "crates/tintcast-app",
    "spike/probe",
    "spike/shell",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
tintcast-theme = { path = "crates/tintcast-theme" }
tintcast-engine = { path = "crates/tintcast-engine" }
tintcast-windows = { path = "crates/tintcast-windows" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = { version = "0.2.37", features = ["serde"] }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
windows = "0.62.2"
windows-registry = "0.6.1"

[profile.dev.package.tintcast-theme]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
